name: Build APK Generator
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/generator
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FloatAIGenerator"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.generator'
              compileSdk 34
              defaultConfig { applicationId "com.example.generator"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { 
                  release { minifyEnabled false } 
                  debug { minifyEnabled false }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FloatAI Admin" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp" android:background="#121212">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔐 Admin Key Generator" android:textColor="#00E5FF" android:textSize="24sp" android:textStyle="bold" android:layout_marginBottom="24dp"/>
              
              <Button android:id="@+id/btnGen1" android:layout_width="match_parent" android:layout_height="50dp" android:text="Generate Trial 1 Hari" android:backgroundTint="#FFC107" android:textColor="#000" android:layout_marginBottom="8dp"/>
              <Button android:id="@+id/btnGen3" android:layout_width="match_parent" android:layout_height="50dp" android:text="Generate Trial 3 Hari" android:backgroundTint="#FF9800" android:textColor="#FFF" android:layout_marginBottom="8dp"/>
              <Button android:id="@+id/btnGen6" android:layout_width="match_parent" android:layout_height="50dp" android:text="Generate Trial 6 Hari" android:backgroundTint="#FF5722" android:textColor="#FFF" android:layout_marginBottom="8dp"/>
              <Button android:id="@+id/btnGenP" android:layout_width="match_parent" android:layout_height="50dp" android:text="Generate Permanen" android:backgroundTint="#4CAF50" android:textColor="#FFF" android:layout_marginBottom="24dp"/>

              <TextView android:id="@+id/tvResult" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Klik tombol di atas..." android:textColor="#00E5FF" android:textSize="18sp" android:textStyle="bold" android:gravity="center" android:padding="16dp" android:background="#222"/>
              <Button android:id="@+id/btnCopy" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="📋 Copy Kode" android:backgroundTint="#2196F3" android:layout_marginTop="16dp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/generator/MainActivity.kt
          package com.example.generator
          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.random.Random

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  val tvResult = findViewById<TextView>(R.id.tvResult)
                  val btnCopy = findViewById<Button>(R.id.btnCopy)

                  fun generateKey(hari: Int, isPermanent: Boolean): String {
                      val dateFormat = SimpleDateFormat("yyyyMMdd", Locale.getDefault())
                      val today = Date()
                      val calendar = Calendar.getInstance()
                      calendar.time = today
                      
                      val seed = dateFormat.format(today).toLong() + 777L
                      val random = Random(seed)
                      val randomNum = random.nextInt(1000, 9999)
                      
                      return if (isPermanent) {
                          "PRM-PERMANEN-$randomNum"
                      } else {
                          calendar.add(Calendar.DAY_OF_YEAR, hari)
                          val expiredDate = dateFormat.format(calendar.time)
                          "TRL-${hari}HARI-$expiredDate-$randomNum"
                      }
                  }

                  findViewById<Button>(R.id.btnGen1).setOnClickListener { tvResult.text = generateKey(1, false) }
                  findViewById<Button>(R.id.btnGen3).setOnClickListener { tvResult.text = generateKey(3, false) }
                  findViewById<Button>(R.id.btnGen6).setOnClickListener { tvResult.text = generateKey(6, false) }
                  findViewById<Button>(R.id.btnGenP).setOnClickListener { tvResult.text = generateKey(0, true) }

                  btnCopy.setOnClickListener {
                      val text = tvResult.text.toString()
                      if (text != "Klik tombol di atas...") {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("Key", text))
                          Toast.makeText(this, "Kode di-copy!", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatAI-Generator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
